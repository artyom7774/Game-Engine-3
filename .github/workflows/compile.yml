name: Compile

on: push

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Include python
        uses: actions/checkout@v4
        with:
          repository: artyom7774/Game-Engine-3-python
          path: python

      - name: Copy python to project
        run: |
          Copy-Item -Path "python/windows" -Destination "src/extra/python/windows" -Recurse -Force
        shell: pwsh

      - name: Compile windows
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: src/extra/compile.iss
          options: /Q /O+

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Engine-3-Installer
          path: src/extra/Game-Engine-3-windows-installer.exe

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned portable Python: no GitHub API calls, same result on every run.
      PY_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20241008/cpython-3.11.10+20241008-x86_64-unknown-linux-gnu-install_only.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Download portable Python
        run: |
          set -eux
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o python.tar.gz "$PY_URL"
          mkdir -p python/linux
          tar -xzf python.tar.gz -C python/linux --strip-components=1
          rm python.tar.gz
          ./python/linux/bin/python3 --version

      - name: Install requirements into portable Python
        run: |
          set -eux
          ./python/linux/bin/python3 -m pip install --upgrade pip
          ./python/linux/bin/python3 -m pip install --retries 5 -r requirements.txt
          ./python/linux/bin/python3 -m pip list

      - name: Create linux archive
        run: |
          set -eu
          D=dist/Game-Engine-3
          mkdir -p "$D"

          # Must exist, otherwise the build fails with a clear message
          for f in "Game Engine 3.py" requirements.txt engine libs src; do
            if [ ! -e "$f" ]; then
              echo "::error::Required path is missing: $f"
              exit 1
            fi
            cp -r "$f" "$D/"
          done

          # Optional, a warning is printed if missing
          for f in COMMANDS.txt counter.py icon.png LICENSE.txt README.md setup.py start.py start.spec TODO.txt descriptions; do
            if [ -e "$f" ]; then
              cp -r "$f" "$D/"
            else
              echo "::warning::Optional path is missing: $f"
            fi
          done

          cp -r python/linux "$D/python"

          cat > "$D/run.sh" <<'EOF'
          #!/usr/bin/env bash
          cd "$(dirname "$(readlink -f "$0")")"
          exec ./python/bin/python3 "Game Engine 3.py" "$@"
          EOF
          chmod +x "$D/run.sh"

          tar -C dist -czf dist/Game-Engine-3-linux.tar.gz Game-Engine-3
          ls -lh dist/Game-Engine-3-linux.tar.gz

      - name: Smoke test
        run: |
          set -eux
          mkdir /tmp/t
          tar -xzf dist/Game-Engine-3-linux.tar.gz -C /tmp/t
          /tmp/t/Game-Engine-3/python/bin/python3 -c "import sys; print(sys.version)"

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Engine-3-Linux
          path: dist/Game-Engine-3-linux.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/GE')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/Game-Engine-3-linux.tar.gz --clobber
