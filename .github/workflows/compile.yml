name: Compile
on: push
jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Include python
        uses: actions/checkout@v4
        with:
          repository: artyom7774/Game-Engine-3-python
          path: python

      - name: Copy python to project
        run: |
          Copy-Item -Path "python/windows" -Destination "src/extra/python/windows" -Recurse -Force
        shell: pwsh

      - name: Compile windows
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: src/extra/compile.iss
          options: /Q /O+

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Engine-3-Installer
          path: src/extra/Game-Engine-3-windows-installer.exe

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile with PyInstaller
        run: |
          pyinstaller start.spec --noconfirm --clean

      - name: Create linux archive
        run: |
          mkdir -p package/Game-Engine-3

          cp -r dist/* package/Game-Engine-3/ 2>/dev/null || true

          cp COMMANDS.txt package/Game-Engine-3/ 2>/dev/null || true
          cp counter.py package/Game-Engine-3/ 2>/dev/null || true
          cp "Game Engine 3.py" package/Game-Engine-3/ 2>/dev/null || true
          cp icon.png package/Game-Engine-3/ 2>/dev/null || true
          cp LICENSE.txt package/Game-Engine-3/ 2>/dev/null || true
          cp README.md package/Game-Engine-3/ 2>/dev/null || true
          cp requirements.txt package/Game-Engine-3/ 2>/dev/null || true
          cp setup.py package/Game-Engine-3/ 2>/dev/null || true
          cp start.py package/Game-Engine-3/ 2>/dev/null || true
          cp start.spec package/Game-Engine-3/ 2>/dev/null || true
          cp TODO.txt package/Game-Engine-3/ 2>/dev/null || true

          cp -r descriptions package/Game-Engine-3/ 2>/dev/null || true
          cp -r engine package/Game-Engine-3/ 2>/dev/null || true
          cp -r libs package/Game-Engine-3/ 2>/dev/null || true
          cp -r src package/Game-Engine-3/ 2>/dev/null || true

          cd package
          tar -czf Game-Engine-3-linux.tar.gz Game-Engine-3/

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Engine-3-Linux
          path: package/Game-Engine-3-linux.tar.gz

