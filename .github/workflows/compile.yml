name: Compile

on: push

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Include python
        uses: actions/checkout@v4
        with:
          repository: artyom7774/Game-Engine-3-python
          path: python

      - name: Copy python to project
        run: |
          Copy-Item -Path "python/windows" -Destination "src/extra/python/windows" -Recurse -Force
        shell: pwsh

      - name: Compile windows
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: src/extra/compile.iss
          options: /Q /O+

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Engine-3-Installer
          path: src/extra/Game-Engine-3-windows-installer.exe

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PY_VERSION: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Download portable Python
        run: |
          set -euo pipefail
          URL=$(gh api repos/astral-sh/python-build-standalone/releases/latest \
            --jq '.assets[].browser_download_url' \
            | grep -E "cpython-${PY_VERSION}\.[0-9]+\+[0-9]+-x86_64-unknown-linux-gnu-install_only\.tar\.gz$" \
            | sort -V | tail -1)
          [ -n "$URL" ] || { echo "Python build not found"; exit 1; }
          echo "Downloading: $URL"
          curl -fsSL -o python.tar.gz "$URL"
          mkdir -p python/linux
          tar -xzf python.tar.gz -C python/linux --strip-components=1
          rm python.tar.gz
          ./python/linux/bin/python3 --version

      - name: Install requirements into portable Python
        run: |
          set -euo pipefail
          ./python/linux/bin/python3 -m pip install --upgrade pip
          ./python/linux/bin/python3 -m pip install -r requirements.txt
          echo "Installed packages:"
          ./python/linux/bin/python3 -m pip list

      - name: Create linux archive
        run: |
          set -euo pipefail
          D=dist/Game-Engine-3
          mkdir -p "$D"

          for f in COMMANDS.txt counter.py "Game Engine 3.py" icon.png LICENSE.txt \
                   README.md requirements.txt setup.py start.py start.spec TODO.txt; do
            cp "$f" "$D/"
          done

          cp -r descriptions engine libs src "$D/"
          cp -r python/linux "$D/python"

          cat > "$D/run.sh" <<'EOF'
          #!/usr/bin/env bash
          cd "$(dirname "$(readlink -f "$0")")"
          exec ./python/bin/python3 "Game Engine 3.py" "$@"
          EOF
          chmod +x "$D/run.sh"

          tar -C dist -czf dist/Game-Engine-3-linux.tar.gz Game-Engine-3

      - name: Smoke test
        run: |
          set -euo pipefail
          mkdir /tmp/t
          tar -xzf dist/Game-Engine-3-linux.tar.gz -C /tmp/t
          /tmp/t/Game-Engine-3/python/bin/python3 -c "import sys; print(sys.version)"

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Engine-3-Linux
          path: dist/Game-Engine-3-linux.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/GE')
        run: gh release upload "${{ github.ref_name }}" dist/Game-Engine-3-linux.tar.gz --clobber
